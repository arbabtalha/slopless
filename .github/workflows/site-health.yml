name: Public website health
on:
  workflow_dispatch:
  workflow_run:
    # The Pages run display name and its underlying workflow name differ.
    workflows: [pages-build-deployment, pages build and deployment]
    types: [completed]
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Check published pages and assets over HTTPS
        run: node scripts/check-live.mjs
