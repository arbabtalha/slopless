name: verify
on:
  push:
    branches: [main, arena/1bd20e2d-slopless]
  pull_request:
permissions:
  contents: read
jobs:
  static:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [18, 20, 22]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
      - name: References, themes, catalog, links and integration tests
        run: npm run check
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Install isolated browser QA dependencies
        run: |
          npm install --prefix "$RUNNER_TEMP/slopless-browser" --no-audit --no-fund puppeteer-core@24 axe-core@4
          BROWSER=$(command -v google-chrome || command -v chromium)
          printf '#!/bin/sh\nexec "%s" --no-sandbox --disable-dev-shm-usage "$@"\n' "$BROWSER" > "$RUNNER_TEMP/slopless-chrome"
          chmod +x "$RUNNER_TEMP/slopless-chrome"
          echo "CHROME_PATH=$RUNNER_TEMP/slopless-chrome" >> "$GITHUB_ENV"
          echo "SLOPLESS_TEST_CHROME=$RUNNER_TEMP/slopless-chrome" >> "$GITHUB_ENV"
          echo "SLOPLESS_PUPPETEER=$RUNNER_TEMP/slopless-browser" >> "$GITHUB_ENV"
          echo "SLOPLESS_TEST_PUPPETEER=$(node -p "require.resolve('puppeteer-core', { paths: ['$RUNNER_TEMP/slopless-browser'] })")" >> "$GITHUB_ENV"
      - name: Renderer and capture regressions (no skips)
        run: npm test
      - name: Website interactions, accessibility and 71 live demos
        run: npm run test:browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: website-qa-screenshots
          path: .test-results/
          if-no-files-found: ignore
